[project]
name = "datasette-plot"
version = "0.1.0a1"
description = "Observable Plot Datasette plugin"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Framework :: Datasette",
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a40"
]

[project.urls]
Homepage = "https://github.com/datasette/datasette-plot"
Changelog = "https://github.com/datasette/datasette-plot/releases"
Issues = "https://github.com/datasette/datasette-plot/issues"
CI = "https://github.com/datasette/datasette-plot/actions"

[project.entry-points.datasette]
plot = "datasette_plot"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
# The TypeScript sources are compiled to static/ - keep them out of the wheel
wheel-exclude = ["datasette_plot/frontend"]
